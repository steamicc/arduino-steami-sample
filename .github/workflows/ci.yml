name: CI

# Compile the sketches a pull request can break with arduino-cli. The
# toolchain versions come from versions.json (single source): nothing is
# pinned in this file. The job always runs and reports, so the required check
# is never pending; only its compile steps are skipped when no sketch is
# concerned. The release compiles every sketch (examples-archive.yml).

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The name of this job is the required status check of the ruleset on main:
  # keep it stable.
  compile:
    name: compile
    runs-on: ubuntu-latest
    steps:
      # The merge commit of the pull request, with the whole history: the
      # selection runs git diff base...head and reads the working tree.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The system Python of the runner is externally managed (PEP 668) and
      # refuses pip installs: use a Python from setup-python instead.
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check the scripts
        run: |
          python -m pip install pytest
          python -m pytest scripts/tests -q

      # A failure of the selection fails the job: it never compiles nothing
      # and passes.
      - name: Select the sketches
        id: selection
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          selection="$(python3 scripts/changed-sketches.py --base "$BASE" --head "$HEAD")"
          echo "$selection"
          echo "$selection" | jq -e 'has("all") and has("sketches")' > /dev/null
          all="$(echo "$selection" | jq -r '.all')"
          sketches="$(echo "$selection" | jq -r '.sketches | join(" ")')"
          if [ "$all" = "true" ] || [ -n "$sketches" ]; then
            compile=true
          else
            compile=false
            echo "::notice::No sketch to compile"
          fi
          {
            echo "all=$all"
            echo "sketches=$sketches"
            echo "compile=$compile"
          } >> "$GITHUB_OUTPUT"

      - name: Read the core version
        id: versions
        if: steps.selection.outputs.compile == 'true'
        run: echo "core=$(python3 scripts/versions.py core)" >> "$GITHUB_OUTPUT"

      # Restore only: the cache is saved on main by examples-archive.yml. One
      # saved from a pull request would serve this pull request alone.
      - name: Restore the Arduino core
        if: steps.selection.outputs.compile == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.arduino15
          key: arduino15-${{ runner.os }}-stm32-${{ steps.versions.outputs.core }}

      - name: Install Arduino CLI
        if: steps.selection.outputs.compile == 'true'
        uses: arduino/setup-arduino-cli@v2

      - name: Compile the selected sketches
        if: steps.selection.outputs.compile == 'true'
        env:
          ALL: ${{ steps.selection.outputs.all }}
          SKETCHES: ${{ steps.selection.outputs.sketches }}
        run: |
          set -euo pipefail
          only=()
          if [ "$ALL" != "true" ]; then
            for id in $SKETCHES; do
              only+=(--only "$id")
            done
          fi
          scripts/compile-examples.sh build/bins "${only[@]}"

      - name: Upload the binaries
        if: steps.selection.outputs.compile == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: steami-exemples-bin
          path: build/bins
          if-no-files-found: error
