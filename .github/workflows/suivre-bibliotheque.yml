name: Follow the STeaMi library

# Bump the version of STeaMi in versions.json once the Arduino Library Manager
# lists the new release of the library, in a single pull request that merges
# by itself when the required check `compile` is green.
#
# Started by the publication of arduino-steami-lib (workflow_dispatch) and
# every hour (the Library Manager can take hours to index a release: the
# hourly run then does nothing until it does, and opens one pull request).
#
# The published release is read in the distribution repository
# steamicc/arduino-steami, the one the Library Manager indexes, like
# suivre-paquet.yml does in the image repository: a release of the library
# alone does not mean a package.
#
# The branch is built from main fetched again after the wait (an earlier
# bump can merge meanwhile), by scripts/bump-branch.sh. When the pull request
# of the robot conflicts with main, the next run rebuilds its branch from main
# (only commits of the robot, with a lease); when main already pins the
# release, it is closed.
#
# The pull request is opened and its auto-merge enabled with the token of the
# GitHub App, never with GITHUB_TOKEN: only a merge made by the App starts
# release.yml (a push made with GITHUB_TOKEN starts no workflow), and so the
# release of the sample and the robots that follow it.
#
# Auto-merge goes through the shared guard .github/scripts/garde-fusion-auto.sh
# (a byte-for-byte copy, checked by scripts/tests/test_garde_fusion_auto.py).
# When auto-merge is already enabled and `compile` is red, the guard re-runs it
# once, then fails this run so that the blocked pull request gets noticed.

on:
  workflow_dispatch:
  schedule:
    - cron: '47 * * * *'

permissions:
  contents: read

concurrency:
  group: suivre-bibliotheque
  cancel-in-progress: false

jobs:
  suivre:
    name: nouvelle version de STeaMi ?
    if: github.repository == 'steamicc/arduino-steami-sample'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The push is made with the token of the App, not the one of checkout.
          persist-credentials: false
          # The history of main, to tell the commits of a leftover branch.
          fetch-depth: 0

      # The hourly run stops here when the sample is up to date, before any
      # installation.
      - name: Compare the release with versions.json
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(gh api repos/steamicc/arduino-steami/releases/latest --jq .tag_name)
          echo "Published release: $TAG"
          {
            echo "tag=$TAG"
            python3 scripts/steami-version.py --released "$TAG"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Install Arduino CLI
        if: steps.compare.outputs.state == 'new'
        uses: arduino/setup-arduino-cli@v2

      # Up to 7 tries, 300 s apart. After the last one, the hourly run starts
      # again.
      - name: Wait for the Library Manager
        id: lm
        if: steps.compare.outputs.state == 'new'
        env:
          TAG: ${{ steps.compare.outputs.tag }}
        run: |
          set -euo pipefail
          state="wait"
          for attempt in 1 2 3 4 5 6 7; do
            arduino-cli lib update-index
            arduino-cli lib search STeaMi --format json > "$RUNNER_TEMP/search.json"
            state=$(python3 scripts/steami-version.py --released "$TAG" \
              --search "$RUNNER_TEMP/search.json" | sed -n 's/^state=//p')
            echo "Try $attempt/7: $state"
            if [ "$state" != "wait" ]; then
              break
            fi
            if [ "$attempt" -lt 7 ]; then
              sleep 300
            fi
          done
          if [ "$state" = "wait" ]; then
            echo "::notice::The Library Manager does not list STeaMi ${TAG#v} yet: the next hourly run will try again."
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Generate token
        id: app
        if: steps.lm.outputs.state == 'bump'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_SECRET }}
          owner: steamicc
          repositories: arduino-steami-sample
          permission-contents: write
          permission-pull-requests: write
          # The guard re-runs a red required check once (gh run rerun).
          permission-actions: write

      - name: Open the pull request
        id: pr
        if: steps.lm.outputs.state == 'bump'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          TAG: ${{ steps.compare.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          BRANCH="fix/steami-$VERSION"
          TITLE="fix(deps): Compile the sketches with STeaMi $VERSION."

          # Open pull requests of the robot, by number (no --author: the
          # Search API lags behind).
          bot_prs() {
            gh pr list --state open --limit 100 \
              --json number,headRefName,author,isCrossRepository \
              --jq "[.[] | select(.author.login == \"app/$APP_SLUG\" and .isCrossRepository == false)]"
          }

          user_id=$(gh api "users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

          pr=$(bot_prs | jq -r --arg b "$BRANCH" '[.[] | select(.headRefName == $b)][0].number // empty')
          rebuild=false
          if [ -n "$pr" ]; then
            # GitHub computes mergeable lazily: UNKNOWN at first.
            mergeable=UNKNOWN
            for _ in 1 2 3 4 5 6; do
              mergeable=$(gh pr view "$pr" --json mergeable --jq .mergeable)
              if [ "$mergeable" != "UNKNOWN" ]; then
                break
              fi
              sleep 10
            done
            echo "Pull request #$pr already open for $BRANCH ($mergeable)."
            if [ "$mergeable" = "CONFLICTING" ]; then
              rebuild=true
            fi
          else
            # Never overwrite the work of somebody else on this branch name
            # (a maintainer can prepare the bump by hand).
            others=$(gh pr list --head "$BRANCH" --state open \
              --json number,author,isCrossRepository \
              --jq "[.[] | select(.author.login != \"app/$APP_SLUG\" and .isCrossRepository == false)] | length")
            if [ "$others" != "0" ]; then
              echo "::warning::A pull request that is not the robot's is open on $BRANCH: nothing done."
              echo "pr=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [ -z "$pr" ] || [ "$rebuild" = "true" ]; then
            # A leftover of the robot (closed pull request) or the branch of
            # its conflicting pull request is replaced. The branch is built
            # from main as it is now (fetched again, not the checkout of the
            # run: an earlier bump can merge during the wait), after checking
            # the pin on that main and that the branch has only commits of
            # the robot, and pushed with a lease on the branch as checked.
            TAG="$TAG" SEARCH="$RUNNER_TEMP/search.json" BRANCH="$BRANCH" \
              TITLE="$TITLE" BOT="${APP_SLUG}[bot]" \
              PUSH_URL="https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" \
              scripts/bump-branch.sh > "$RUNNER_TEMP/bump.txt"
            cat "$RUNNER_TEMP/bump.txt"
            result=$(sed -n 's/^result=//p' "$RUNNER_TEMP/bump.txt" | tail -n 1)
            case "$result" in
              pushed)
                if [ -n "$pr" ]; then
                  echo "Pull request #$pr rebuilt from main."
                else
                  url=$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body \
                    "The Arduino Library Manager now lists STeaMi $VERSION. This pull request pins it in \`versions.json\`; every sketch is compiled with it, and the pull request merges by itself when \`compile\` is green. Closing it without merging makes the next hourly run reopen it: to stop that, disable the workflow. Opened by \`suivre-bibliotheque.yml\`.")
                  pr="${url##*/}"
                  echo "Opened pull request #$pr."
                fi
                ;;
              up-to-date)
                echo "::notice::main already pins STeaMi $VERSION or a newer version: nothing to open."
                # The branch holds only commits of the robot (checked first).
                if [ -n "$pr" ]; then
                  gh pr close "$pr" --comment "main already pins STeaMi $VERSION or a newer version." --delete-branch
                fi
                echo "pr=" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              foreign)
                echo "::warning::The branch $BRANCH has commits that are not the robot's: nothing done."
                echo "pr=" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              *)
                echo "::error::scripts/bump-branch.sh gave no result (\"$result\")."
                exit 1
                ;;
            esac
          fi

          # An older bump the new one replaces.
          for other in $(bot_prs | jq -r --arg b "$BRANCH" '.[] | select((.headRefName | startswith("fix/steami-")) and .headRefName != $b) | .number'); do
            gh pr close "$other" --comment "Superseded by #$pr." --delete-branch
          done

          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      # With the token of the App on purpose: an auto-merge is made by whoever
      # enabled it, and only a merge by the App starts release.yml.
      - name: Enable auto-merge
        # No pull request number: the previous step left the branch to somebody else.
        if: steps.lm.outputs.state == 'bump' && steps.pr.outputs.pr != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          PR: ${{ steps.pr.outputs.pr }}
        # The shared guard of the steamicc robots (fork, author, required
        # check "compile" on the default branch, no bypass of its ruleset,
        # draft and "garder-ouverte" label, then one re-run of a red check
        # when auto-merge is already enabled): never edit it here.
        run: bash .github/scripts/garde-fusion-auto.sh "$GITHUB_REPOSITORY" "$PR" "$APP_SLUG" compile
